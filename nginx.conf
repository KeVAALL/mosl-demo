server {
    listen 80;
    server_name localhost;

    # Root directory for the entire server
    root /usr/share/nginx/html/public;

    # Debugging headers (optional)
    add_header X-Debug-Request-URI $request_uri always;
    add_header X-Debug-Request-Filename $request_filename always;

    # Serve landing page (root /)
    location = / {
        index index.html;
        try_files /index.html =404;
    }

    # Catch-all for unknown routes - serve React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
